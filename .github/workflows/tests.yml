name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # The inherited folders in src/ have ~320 pre-existing violations; fix those in a separate
      # refactor/ branch. Until then, enforce lint only on the code we actively maintain.
      - name: Run ruff check
        run: uvx ruff check tests/ src/corpus/ src/graph/ src/queries/ src/retrieval/ src/explorer/
      - name: Run ruff format check
        run: uvx ruff format --check tests/ src/corpus/ src/graph/ src/queries/ src/retrieval/ src/explorer/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies only
        run: uv sync --only-group dev --frozen
      - name: Run tests
        run: uv run --group dev pytest tests/ -q

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Static build
        run: npm run build
